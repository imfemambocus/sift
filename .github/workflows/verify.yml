name: Verify

# the shell and browser suites, which drive real HTTP, a real browser and the packaged container.
# they are slow and they share ports, so they run one at a time in their own workflow rather than
# holding up the fast one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # each suite waits about two and a half minutes for "Started SiftApplication", and a cold
      # bootRun would spend most of that resolving dependencies and compiling
      - name: Warm the build
        working-directory: backend
        run: ./gradlew classes

      # one at a time, in the foreground. they share Postgres on 5439 and the backend on 7779, so
      # two at once produce a wall of failures that read as application bugs.
      - name: Sync
        run: ./verify/verify-sync.sh

      - name: Merge requests
        run: ./verify/verify-mr.sh

      - name: Participation
        run: ./verify/verify-participation.sh

      - name: Read state
        run: ./verify/verify-read.sh

      - name: OAuth
        run: ./verify/verify-oauth.sh

      - name: Gmail
        run: ./verify/verify-gmail.sh

      - name: An unreadable token
        run: ./verify/verify-unreadable-token.sh

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend
        working-directory: frontend
        run: npm ci

      # puppeteer is not a dependency of this project and must never become one, so it is installed
      # for the run only. --no-save keeps it out of package.json and the lockfile.
      - name: Install the browser
        working-directory: frontend
        run: npm install --no-save puppeteer

      # the runner image restricts unprivileged user namespaces with AppArmor, and Chromium's own
      # sandbox needs them. relaxing it here keeps that sandbox on, where passing --no-sandbox to
      # the harness would turn it off for every local run as well.
      - name: Allow the browser sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Warm the build
        working-directory: backend
        run: ./gradlew classes

      - name: The feed in a browser
        run: ./verify/verify-feed-ui.sh
        env:
          SIFT_VERIFY_SHOTS: ${{ runner.temp }}/shots

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
