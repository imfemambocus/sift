name: CI

on:
  push:
    branches: [main]
  pull_request:

# a second push to the same branch replaces the run in flight rather than queueing behind it
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the Gradle wrapper provisions its own Java 25 toolchain, but handing it one already
      # installed saves that download on every run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # the tests are Testcontainers against a real Postgres 17, which needs the Docker daemon
      # the runner already has. nothing here starts a database itself.
      - name: Tests
        working-directory: backend
        run: ./gradlew test

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs what the lockfile says and fails if the two disagree
      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx vite build
