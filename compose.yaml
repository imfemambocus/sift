name: sift

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # bound to loopback so `make backend` can reach it from the host without putting the
    # database on the network, and off 5432 so it cannot clash with another local postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    # without this the app races postgres on a cold start and crash-loops
    depends_on:
      db:
        condition: service_healthy
    environment:
      SIFT_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SIFT_DB_USER: ${POSTGRES_USER}
      SIFT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SIFT_ENCRYPTION_KEY: ${SIFT_ENCRYPTION_KEY}
      SIFT_ALLOWED_EMAIL_DOMAINS: ${SIFT_ALLOWED_EMAIL_DOMAINS:-}
      # without these, Settings can only say how to register an application: an approval on the
      # instance is the only way to connect a source
      SIFT_GITLAB_URL: ${SIFT_GITLAB_URL:-}
      SIFT_GITLAB_CLIENT_ID: ${SIFT_GITLAB_CLIENT_ID:-}
      SIFT_GITLAB_CLIENT_SECRET: ${SIFT_GITLAB_CLIENT_SECRET:-}
      SIFT_GITLAB_REDIRECT_URI: ${SIFT_GITLAB_REDIRECT_URI:-http://localhost:7777/api/sources/gitlab/oauth/callback}
      SIFT_GMAIL_CLIENT_ID: ${SIFT_GMAIL_CLIENT_ID:-}
      SIFT_GMAIL_CLIENT_SECRET: ${SIFT_GMAIL_CLIENT_SECRET:-}
      SIFT_GMAIL_REDIRECT_URI: ${SIFT_GMAIL_REDIRECT_URI:-http://localhost:7777/api/sources/gmail/oauth/callback}
      # how far back connecting a mailbox reads. every sweep after that takes only what is newer.
      # forwarded so the sweep stays tunable from .env; shortening it is the only practical way to
      # watch a sync happen without waiting five minutes
      SIFT_SYNC_INTERVAL: ${SIFT_SYNC_INTERVAL:-PT5M}
      SIFT_SYNC_INITIAL_DELAY: ${SIFT_SYNC_INITIAL_DELAY:-PT30S}
      SIFT_SYNC_MAX_PAGES: ${SIFT_SYNC_MAX_PAGES:-20}
    # SIFT_PORT is deliberately not forwarded: the published port below is fixed, and changing only
    # the app's side would break the mapping
    ports:
      - "127.0.0.1:7777:7777"
    # busybox wget is in the alpine JRE image already, so this adds nothing to it. actuator exposes
    # health alone and /actuator/health/** is permitAll, so an unauthenticated probe is a real
    # answer rather than a 401 that always passes
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7777/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # flyway plus the context is about half a minute on a cold start
      start_period: 45s

volumes:
  db-data:
