spring:
  application:
    name: sift
  datasource:
    url: ${SIFT_DB_URL:jdbc:postgresql://localhost:5432/sift}
    username: ${SIFT_DB_USER:sift}
    password: ${SIFT_DB_PASSWORD:sift}
  jpa:
    open-in-view: false
    hibernate:
      # flyway owns the schema; validate makes a drifted entity fail at boot instead of at runtime
      ddl-auto: validate
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  threads:
    virtual:
      enabled: true

server:
  # deliberately clear of 8080-8090, which local service stacks tend to occupy
  port: ${SIFT_PORT:7777}
  shutdown: graceful
  tomcat:
    # the OAuth callback redirects to /settings. left false, tomcat expands that into an absolute
    # URL built from the Host it was called with, which behind a proxy is the backend's own origin:
    # the browser then leaves the origin it started on. true sends the Location header as written.
    use-relative-redirects: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

sift:
  # base64 of 32 random bytes; boot fails with an explanatory message when absent
  encryption-key: ${SIFT_ENCRYPTION_KEY:}
  registration:
    # empty means any address may register, which is only appropriate for a local instance
    allowed-email-domains: ${SIFT_ALLOWED_EMAIL_DOMAINS:}
  gitlab:
    # the OAuth application registered on one GitLab instance. all four or none: with any of them
    # absent, Settings offers the pasted-token form only.
    oauth:
      instance-url: ${SIFT_GITLAB_URL:}
      client-id: ${SIFT_GITLAB_CLIENT_ID:}
      client-secret: ${SIFT_GITLAB_CLIENT_SECRET:}
      # must match the application's redirect URI on GitLab exactly, character for character
      redirect-uri: ${SIFT_GITLAB_REDIRECT_URI:http://localhost:7777/api/sources/gitlab/oauth/callback}
  sync:
    # the scheduled sweep reads it as a placeholder, so it must always have a value here
    interval: ${SIFT_SYNC_INTERVAL:PT5M}
    initial-delay: ${SIFT_SYNC_INITIAL_DELAY:PT30S}
    # a safety net on paging, not an expected limit: hitting it is logged as incomplete
    max-pages: ${SIFT_SYNC_MAX_PAGES:20}
